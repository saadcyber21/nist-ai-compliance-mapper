name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Zero runtime dependencies is the point of this toolkit, so there is no
      # requirements install step. pytest is the only thing added, and only here.
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Validate architecture.json
        run: python -m json.tool architecture.json > /dev/null

      - name: NIST AI RMF mapping
        run: python nist_mapper.py --config architecture.json --output audit_report_ci.md

      - name: SAST engine against the vulnerable fixture
        # Expected to exit 1: the fixture contains two deliberate flaws and the
        # scanner must catch both. --allow-findings turns "detected" into a
        # passing step, so a scanner that stops detecting fails here.
        run: python sast_engine.py vulnerable_app.py --allow-findings

      - name: Test suite
        run: pytest -q --maxfail=3

      - name: Upload generated audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-py${{ matrix.python-version }}
          path: audit_report_ci.md
          if-no-files-found: ignore
